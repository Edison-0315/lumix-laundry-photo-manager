<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; connect-src 'self'">
<title>洗衣机管理器</title><link rel="icon" href="lumix.ico"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="glass.css"><link rel="stylesheet" href="pearl.css"><link rel="stylesheet" href="gallery.css"></head>
<body>
<div id="ambient-photo" aria-hidden="true"></div>
<header class="appbar"><div class="brand"><img class="brandmark" src="lumix.svg" alt="LUMIX">洗衣机管理器</div><span id="context" class="muted">从选片到交付</span><div class="spacer"></div><button id="settings" class="outline icon-button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.7 2.2-2 .9-2.2-.5-2.1 3.6L4 11v2l-1.5 1.8 2.1 3.6 2.2-.5 2 .9.7 2.2h5l.7-2.2 2-.9 2.2.5 2.1-3.6L20 13v-2l1.5-1.8-2.1-3.6-2.2.5-2-.9-.7-2.2z"/><circle cx="12" cy="12" r="3.2"/></svg></button></header>
<div class="shell">
  <div id="sidebar-scene" aria-hidden="true"><div class="sidebar-photo"></div><div class="sidebar-photo"></div></div>
  <aside class="sidebar"><div class="sidebar-content"><div class="sidebar-navigation"><nav><button data-view="sd" class="nav active">选片</button><button data-view="library" class="nav">照片库</button></nav>
    <section id="activities-section"><div class="section-head"><span class="section-label">活动</span><button id="new-activity" aria-label="新建活动">＋</button></div><div id="activities"></div></section>
    <section id="source-section" hidden><div class="section-label">来源文件夹</div><div id="source-folders"></div></section>
    <section id="people-section" hidden><div class="section-head"><button id="people-collapse" aria-expanded="true" aria-controls="people-body"><span class="disclosure-caret" aria-hidden="true">›</span>人物</button><button id="new-person" aria-label="新建人物">＋</button></div><div id="people-body"><button id="people-all" class="side-item">全部人物</button><div id="people"></div><button id="manage-people" class="muted small">管理人物</button></div></section>
    </div><div class="sidebar-bottom"><div class="library-caption">当前照片库</div><span id="library-path" class="small muted">尚未选择照片库</span><button id="choose-library" class="outline">管理照片库</button><button id="trash" class="trash-nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg>回收站</button></div>
  </div></aside>
  <main>
    <div class="pagehead"><button id="back" class="outline" aria-label="返回" title="返回上一页（Alt+←）" disabled>← 返回</button><div><h1 id="title">选片</h1><p id="subtitle" class="muted">选择SD卡或照片文件夹，在这里查看和选片</p></div><label id="source-read-label" class="small muted">读取 <select id="source-read-format" aria-label="读取格式"><option value="both">JPEG 和 RAW</option><option value="jpeg">仅 JPEG</option><option value="raw">仅 RAW</option></select></label><button id="choose-source" class="outline">选择来源</button><button id="classify" class="outline" hidden>识别人脸</button><button id="toggle-browse" class="outline" hidden>平铺照片</button></div>
    <div id="stage-tabs" class="tabs" hidden><button data-stage="all" class="active">全部照片</button><button data-stage="pending">选出原片</button><button data-stage="edited">已修原片</button><button data-stage="exports">成片</button></div>
    <div id="source-breadcrumbs" class="breadcrumbs" hidden></div>
    <div id="library-breadcrumbs" class="breadcrumbs" hidden></div>
    <div class="toolbar"><label>日期 <select id="date-filter"><option value="all">所有日期</option></select></label><label>格式 <select id="format-filter"><option value="all">所有格式</option><option value="jpeg">JPEG</option><option value="raw">RAW</option></select></label><button id="select-all">全选</button><label class="check-label"><input id="only-selected" type="checkbox">只看已选</label><div class="spacer"></div><div class="thumbnail-control"><span class="small muted">缩略图</span><button id="thumb-smaller" aria-label="缩小缩略图">−</button><input id="thumb-size" type="range" min="80" max="720" step="20" value="240" aria-label="缩略图大小"><button id="thumb-larger" aria-label="放大缩略图">＋</button><output id="thumb-size-label" for="thumb-size">240</output></div></div>
    <div id="gallery" tabindex="0" aria-label="照片网格"></div>
    <footer><span id="photo-count" class="muted">0 张照片</span><span id="selection-count">已选 0 张</span><div class="spacer"></div><button id="import" class="primary" disabled>导入所选</button><div id="library-actions" hidden><button id="assign" disabled>调整人物</button><button id="more-actions" aria-haspopup="menu" disabled>更多操作</button><span hidden><button id="mark-edited" disabled>标为已修</button><button id="mark-pending" disabled>恢复待修</button><button id="mark-finished" disabled>标为成片</button><button id="unmark-finished" disabled hidden>取消成片</button></span></div></footer>
  </main>
  <aside id="inspector" class="inspector"><div class="empty"><span>选择一张照片</span><small>单击选择 · 双击查看大图<br>拖动可批量选择</small></div></aside>
</div>
<div id="taskbar" hidden><div><strong id="task-message"></strong><span id="task-progress" class="muted"></span></div><progress id="task-meter" max="1"></progress><button id="cancel-task">取消</button></div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<dialog id="viewer" aria-label="照片预览"><div class="viewer-toolbar"><div class="viewer-navigation"><button id="viewer-prev" aria-label="上一张" title="上一张（←）">←</button><button id="viewer-next" aria-label="下一张" title="下一张（→）">→</button><span id="viewer-position" class="muted small"></span></div><span id="viewer-name"></span><div class="spacer"></div><button id="viewer-select" aria-pressed="false" title="选中照片（空格）">选中照片</button><div class="viewer-zoom-controls"><button id="viewer-out" aria-label="缩小大图">−</button><output id="viewer-zoom" aria-label="缩放比例">—</output><button id="viewer-in" aria-label="放大大图">＋</button><button id="viewer-fit">适应窗口</button><button id="viewer-actual">100%</button></div><button id="viewer-close" aria-label="关闭大图" title="关闭预览（Esc）">✕</button></div><div id="viewer-canvas" tabindex="0" aria-label="照片画布，滚轮缩放，拖动平移，空格选片"><img id="viewer-image" alt="照片大图" draggable="false" hidden><div id="viewer-status" role="status"><span id="viewer-error"></span><button id="viewer-retry" class="outline" hidden>重新读取</button></div></div><div class="viewer-hint muted small"><span>滚轮缩放 · 拖动平移</span><span>← → 切换 · 空格选片 · Esc 关闭</span></div></dialog>
<div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body></html>
